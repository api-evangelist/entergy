  rfc8594: false
  deprecated_operations: []
  note: >-
    No deprecation policy, no Deprecation or Sunset header on any observed response, and no
    operation in the derived spec is marked deprecated. A caller gets no warning before a
    namespace or plugin route disappears. No Deprecation pointer is emitted in apis.yml,
    because there is nothing to point at.
sla:
  published: false
  note: No API service-level commitment of any kind.
status_page:
  url: null
  published: false
  note: >-
    Entergy has no API status page and no NO StatusPage pointer is emitted. It does publish a
    customer outage map at https://www.entergy.com/viewoutages (HTTP 200), but that reports
    the electric grid, not API availability, and the application behind it belongs to
    DataCapable rather than to Entergy. Treating it as a status page would credit Entergy with
    an operational surface it does not run.
change_log:
