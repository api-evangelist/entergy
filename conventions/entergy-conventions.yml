name: Entergy API conventions
summary: >-
  Cross-cutting runtime semantics for the only anonymous, callable API Entergy serves - the
  WordPress REST API on www.entergy.com. Entergy publishes no API style guide, so every rule
  below is either WordPress core behaviour observed live on this host or explicitly recorded
  as absent.
auth_style:
  summary: Anonymous for public read routes; WordPress Application Passwords (HTTP Basic) or cookie+X-WP-Nonce for everything else.
  see: authentication/entergy-authentication.yml
pagination:
  style: page-number
  params:
    - name: page
      description: 1-indexed page number.
    - name: per_page
      description: Items per page, WordPress default 10, maximum 100.
    - name: offset
      description: Skip N items, supported on collection routes.
  response_fields: []
  response_headers:
    - name: X-WP-Total
      description: Total matching items. Observed value 5958 on wp/v2/posts.
    - name: X-WP-TotalPages
      description: Total pages for the requested per_page.
    - name: Link
      description: RFC 8288 rel="next" / rel="prev" cursors. Observed rel="next" on wp/v2/posts.
  evidence: https://www.entergy.com/wp-json/wp/v2/posts?per_page=1
  evidence_status: 200
field_expansion:
  supported: true
  params:
