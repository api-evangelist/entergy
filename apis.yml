apis:
- name: Entergy ArcGIS Server
  description: >-
    Entergy's electric-network GIS platform at gis.entergy.com, running Esri ArcGIS Server 10.7.1. The
    service-info document answers anonymously and declares token-based security with a token service at
    https://gis.entergy.com/arcgis/tokens/; the SOAP catalog at https://gis.entergy.com/arcgis/services
    publishes a WSDL 1.1 contract with seven operations whose soap:address points back at gis.entergy.com.
    The service directory itself returns HTTP 200 carrying {"error":{"code":499,"message":"Token Required"}},
    so the API is real and reachable while the map services behind it are not public.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/entergy.png
  humanURL: https://gis.entergy.com/arcgis/rest/info?f=json
  baseURL: https://gis.entergy.com/arcgis
