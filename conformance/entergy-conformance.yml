domain_standards:
  - id: naesb-req21-espi
    name: NAESB REQ.21 Energy Services Provider Interface (Green Button Connect My Data)
    market: retail electric utility / customer energy usage data sharing
    conforms: true
    evidence: https://myentergyadvisor.entergy.com/greenbutton/welcome
    evidence_status: 200
    evidence_type: provider-published program page
    detail: >-
      Entergy Texas operates Green Button Connect My Data, the NAESB REQ.21 ESPI profile for
      letting a customer authorize a third-party service provider to pull their advanced-meter
      interval data in a common format. Entergy runs the program on its own host and takes
      vendor registrations at /greenbutton/green-vendor (HTTP 200). This is the single
      domain-standard commitment in the record, and for a utility it is the one that matters:
      a service provider that already speaks ESPI integrates with no bespoke connector.
    caveat: >-
      GRADED HONESTLY: the CONTRACT was not observed. Entergy publishes no ESPI endpoint URL,
      no authorization server, no scope list and no ESPI XML schema anonymously - all of it
      sits behind the vendor registration form. Conformance is asserted from Entergy's own
      program page naming the standard, not from a fetched ESPI contract, and no ESPI artifact
      has been written to this repo.
  - id: esri-arcgis-rest
    name: Esri ArcGIS Server REST/SOAP service interface
    market: geospatial / electric utility network GIS
    conforms: true
    evidence: https://gis.entergy.com/arcgis/rest/info?f=json
    evidence_status: 200
    detail: >-
      ArcGIS Server 10.7.1 (currentVersion 10.71), token-based security, token service at
      /arcgis/tokens/, SOAP catalog at /arcgis/services. A vendor interface rather than an open
      standard, but it is a real, published, self-describing contract shape.
